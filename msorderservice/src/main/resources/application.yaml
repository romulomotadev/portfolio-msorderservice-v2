spring:
  application:
    name: msorderservice

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/orderservice_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/PORTFOLIO_REALM
          jwk-set-uri: http://keycloak:8080/realms/PORTFOLIO_REALM/protocol/openid-connect/certs

keycloak:
  url: http://keycloak:8080
  realm: PORTFOLIO_REALM
  client-id: orders-service
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}