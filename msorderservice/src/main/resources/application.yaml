spring:
  application:
    name: msorderservice

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/PORTFOLIO_REALM

keycloak:
  url: http://localhost:8081
  realm: PORTFOLIO_REALM
  client-id: orders-service
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}