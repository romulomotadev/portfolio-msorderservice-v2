spring:
  application:
    name: mscloudgateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true  # habilitando localizador de microsserviços
              lower-case-service-id: true # localizar por lower case (caixa baixa)

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/PORTFOLIO_REALM
          jwk-set-uri: http://keycloak:8080/realms/PORTFOLIO_REALM/protocol/openid-connect/certs

server:
  port: 8080

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
