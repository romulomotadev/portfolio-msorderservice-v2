spring:
  application:
    name: msclients

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/PORTFOLIO_REALM
          jwk-set-uri: http://keycloak:8080/realms/PORTFOLIO_REALM/protocol/openid-connect/certs

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
